# Runs every rule test and builds the contract.
name: Rules and build
on:
  push:
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rule tests
        working-directory: contract
        run: cargo test -p ovation-rules
      - name: Build the contract
        working-directory: contract
        run: cargo build --release --target wasm32-unknown-unknown -p ovation
