[package]
name = "ovation"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "Applause that pays: members of a Sputnik DAO applaud each other, and breadth of applause splits a budget the council approved."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `legacy` gives write-through collections, so env::storage_usage() is exact when a stage is charged for storage.
near-sdk = { version = "5.30", features = ["legacy"] }
ovation-rules = { path = "rules" }

[workspace]
members = ["rules", "agent"]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = true
