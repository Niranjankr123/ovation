<!doctype html>
<!-- The title cards of the demo video. Open with ?s=intro1 (or intro2, intro3, intro4, brand,
     d0..d3, close1, close2). They share the site's stylesheet so they look like the product. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Ovation demo card</title>
    <link rel="stylesheet" href="../web/style.css" />
    <style>
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(1200px 700px at 20% 0%, #fff7ea, var(--paper));
      }
      .stage {
        width: 1120px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 56px;
        align-items: center;
      }
      .stage.one {
        grid-template-columns: 1fr;
        text-align: center;
        justify-items: center;
      }
      .big {
        font: 600 54px/1.12 var(--serif);
        letter-spacing: -0.015em;
      }
      .big em {
        font-style: normal;
        color: var(--accent);
      }
      .lead {
        font-size: 24px;
        color: var(--muted);
        margin-top: 18px;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 26px;
        box-shadow: 0 2px 4px rgba(27, 26, 23, 0.05), 0 24px 60px rgba(27, 26, 23, 0.1);
      }
      .panel h3 {
        font-size: 15px;
        font-family: var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 14px;
      }
      .row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 14px;
        padding: 12px 0;
        border-top: 1px solid var(--line);
        font-size: 19px;
        opacity: 0;
        animation: in 0.5s ease forwards;
      }
      .row:first-of-type {
        border-top: 0;
      }
      .row time {
        color: var(--muted);
        font: 15px var(--mono);
        padding-top: 4px;
      }
      .row:nth-of-type(1) {
        animation-delay: 0.3s;
      }
      .row:nth-of-type(2) {
        animation-delay: 0.9s;
      }
      .row:nth-of-type(3) {
        animation-delay: 1.5s;
      }
      .row:nth-of-type(4) {
        animation-delay: 2.1s;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .rise {
        opacity: 0;
        animation: in 0.6s ease forwards;
      }
      .field {
        margin-top: 16px;
      }
      .field span {
        display: block;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .box {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 13px 14px;
        font-size: 19px;
        background: var(--paper);
        min-height: 52px;
        color: var(--muted);
      }
      .box.filled {
        color: var(--ink);
      }
      .caret::after {
        content: "";
        display: inline-block;
        width: 2px;
        height: 22px;
        background: var(--accent);
        vertical-align: -4px;
        margin-left: 2px;
        animation: blink 1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .cta {
        margin-top: 20px;
        display: inline-block;
        padding: 13px 20px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        font-size: 18px;
      }
      .gone {
        opacity: 0.38;
        filter: grayscale(1);
      }
      .stamp {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .stamp b {
        font: 700 34px var(--sans);
        letter-spacing: 0.04em;
        color: var(--accent);
        border: 4px solid var(--accent);
        border-radius: 14px;
        padding: 10px 22px;
        transform: rotate(-8deg) scale(1.6);
        opacity: 0;
        background: color-mix(in srgb, var(--card) 88%, transparent);
        animation: stamp 0.35s 0.7s cubic-bezier(0.2, 1.4, 0.4, 1) forwards;
      }
      @keyframes stamp {
        to {
          transform: rotate(-8deg) scale(1);
          opacity: 1;
        }
      }
      .bubble {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: start;
        margin-top: 14px;
        opacity: 0;
        animation: in 0.5s ease forwards;
      }
      .bubble:nth-of-type(1) {
        animation-delay: 0.5s;
      }
      .bubble:nth-of-type(2) {
        animation-delay: 1.1s;
      }
      .bubble:nth-of-type(3) {
        animation-delay: 1.7s;
      }
      .bubble p {
        margin: 0;
        background: var(--wash);
        border-radius: 4px 16px 16px 16px;
        padding: 11px 15px;
        font-size: 19px;
      }
      .bubble p b {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .nothing {
        height: 190px;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 19px;
        border: 2px dashed var(--line);
        border-radius: 14px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 20px;
        font: 600 92px var(--serif);
        letter-spacing: -0.02em;
      }
      .small {
        font-size: 17px;
        color: var(--muted);
      }
      .flow {
        width: 1160px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 26px;
      }
      .node {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 20px;
        padding: 26px;
        transition: all 0.4s ease;
        opacity: 0.45;
      }
      .node.on {
        opacity: 1;
        border-color: var(--accent);
        box-shadow: 0 0 0 8px var(--accent-soft), 0 24px 60px rgba(27, 26, 23, 0.12);
        transform: translateY(-6px);
      }
      .node .k {
        font: 700 14px var(--sans);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .node h2 {
        font-size: 34px;
        margin: 8px 0 10px;
      }
      .node p {
        font-size: 20px;
        color: var(--muted);
        margin: 0;
      }
      .flow-title {
        grid-column: 1 / -1;
        text-align: center;
        margin-bottom: 14px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const mark =
        '<svg viewBox="0 0 32 32" width="96" height="96"><rect width="32" height="32" rx="8" fill="#c2412d"/><path d="M9 21c2-6 12-6 14 0M6 17c3-10 17-10 20 0M12 24c1-3 7-3 8 0" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
      const av = (name, hue) => `<span class="avatar" style="--h:${hue}">${name[0]}</span>`;
      const form = (cls, stamp) => `
        <div class="panel" style="position:relative">
          <div class="${cls}">
            <h3>New payment request</h3>
            <div class="field"><span>Pay to</span><div class="box filled">ravi.near</div></div>
            <div class="field"><span>Amount</span><div class="box">How much do you think you deserve?</div></div>
            <div class="field"><span>Reason</span><div class="box"><span class="caret">Why should the council pay you</span></div></div>
            <span class="cta">Send to the council</span>
          </div>
          ${stamp ? '<div class="stamp"><b>DRAFT DISCARDED</b></div>' : ""}
        </div>`;
      const flow = (on) => `
        <div class="flow">
          <div class="flow-title"><div class="big" style="font-size:44px">NEAR is what makes this work</div></div>
          <div class="node ${on === 1 ? "on" : ""}"><div class="k">Sputnik DAO</div><h2>The treasury</h2><p>Keeps the money and the members. It pays every payout itself.</p></div>
          <div class="node ${on === 2 ? "on" : ""}"><div class="k">The Ovation contract</div><h2>One narrow role</h2><p>Through the stage's own account, it may file transfers and approve small ones. One council vote removes it.</p></div>
          <div class="node ${on === 3 ? "on" : ""}"><div class="k">NEAR Social</div><h2>The applause</h2><p>Every clap is a public post, written by the stage's own account, which only the contract can use.</p></div>
        </div>`;
      const scenes = {
        intro1: `
          <div class="stage">
            <div><div class="big rise">Ravi spent his whole weekend <em>fixing the indexer.</em></div><div class="lead rise" style="animation-delay:2.6s">Nobody asked him to.</div></div>
            <div class="panel">
              <h3>ravi &middot; last weekend</h3>
              <div class="row"><time>Sat 02:14</time><span>fix: indexer stalls on a reorg</span></div>
              <div class="row"><time>Sat 11:40</time><span>perf: batch writes, sync is 10&times; faster</span></div>
              <div class="row"><time>Sun 01:05</time><span>fix: receipts lost after a restart</span></div>
              <div class="row"><time>Sun 23:52</time><span>docs: runbook for the next outage</span></div>
            </div>
          </div>`,
        intro2: `
          <div class="stage">
            <div><div class="big rise">To get paid, he would have to <em>ask. For himself.</em></div><div class="lead rise" style="animation-delay:.8s">His community has a treasury. It pays whoever writes a proposal.</div></div>
            ${form("", false)}
          </div>`,
        intro3: `
          <div class="stage">
            <div><div class="big rise">So he doesn't.<br /><em>Most people don't.</em></div></div>
            ${form("gone", true)}
          </div>`,
        intro4: `
          <div class="stage">
            <div class="panel"><h3>What the council saw</h3><div class="nothing">No requests this week.</div></div>
            <div class="panel">
              <h3>What his teammates saw</h3>
              <div class="bubble">${av("Asha", 348)}<p><b>Asha</b>Ravi fixed it overnight. Again.</p></div>
              <div class="bubble">${av("Diego", 150)}<p><b>Diego</b>The indexer is flying.</p></div>
              <div class="bubble">${av("Mei", 12)}<p><b>Mei</b>He saved the launch.</p></div>
            </div>
          </div>`,
        brand: `
          <div class="stage one">
            <div class="logo rise">${mark}<span>Ovation</span></div>
            <div class="big rise" style="font-size:46px;margin-top:26px;animation-delay:.5s">Their applause decides <em>who gets paid.</em></div>
            <div class="lead rise" style="animation-delay:1s">From the treasury the community already has.</div>
          </div>`,
        d0: flow(0),
        d1: flow(1),
        d2: flow(2),
        d3: flow(3),
        close1: `
          <div class="stage one">
            <div class="big rise" style="font-size:66px">Ravi never had to ask.</div>
            <div class="lead rise" style="font-size:30px;animation-delay:1.4s">His community said thank you. <em style="font-style:normal;color:var(--accent)">And meant it.</em></div>
          </div>`,
        close2: `
          <div class="stage one">
            <div class="logo rise">${mark}<span>Ovation</span></div>
            <div class="big rise" style="font-size:42px;margin-top:22px;animation-delay:.4s">Applause that pays. <em>Try it yourself.</em></div>
            <div class="lead rise" style="animation-delay:.9s">The link is in the post.</div>
            <div class="small rise" style="margin-top:44px;animation-delay:1.3s">Recorded on NEAR testnet with test tokens. Waits are shortened. The narration is an AI voice.</div>
          </div>`,
      };
      const s = new URLSearchParams(location.search).get("s") || "brand";
      document.getElementById("root").innerHTML = scenes[s] || scenes.brand;
    </script>
  </body>
</html>
